<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Cpath d='M1 12 L5 7 L8 9 L15 3' fill='none' stroke='%238ae234' stroke-width='1.6'/%3E%3C/svg%3E">
<title>plot-go — live counters, plotted as they arrive</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0b0e14; }
  /* The terminal owns its own font metrics and cell grid; this only gives it
     somewhere to live, and has to be the element that fills the viewport. */
  #term { height: 100%; padding: 6px; box-sizing: border-box; position: relative; }
  #boot { padding: 14px; color: #6b7280;
          font: 13px ui-monospace, SFMono-Regular, Menlo, monospace; }
</style>
</head>
<body>
<div id="term"><div id="boot">collecting…</div></div>
<script src="wasm_exec.js"></script>
<script>
  const go = new Go();
  WebAssembly.instantiateStreaming(fetch("plot.wasm"), go.importObject)
    .then((r) => go.run(r.instance))
    .catch((e) => { document.getElementById("boot").textContent = "failed to load: " + e; });
</script>
</body>
</html>
